{% extends 'base.html' %}
{% block content %}
<div style="text-align: center; padding: 60px 20px; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 72px; font-weight: 800; color: #ef4444; margin-bottom: 10px;">500</div>
    <h2 style="font-size: 28px; margin-bottom: 15px; color: #1e293b;">Internal Server Error</h2>
    <p style="color: #64748b; font-size: 16px; margin-bottom: 30px;">
        Something went wrong on our end while processing your request. Please try refreshing the page or return to the dashboard.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center;">
        <a href="javascript:location.reload();" style="display: inline-block; padding: 12px 24px; background: #64748b; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s ease;">
            Refresh Page
        </a>
        <a href="{% url 'dashboard' %}" style="display: inline-block; padding: 12px 24px; background: #22c55e; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s ease;">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
