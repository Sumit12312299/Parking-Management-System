{% extends 'base.html' %}
{% block content %}

<style>
.booking-page-container {
    min-height: calc(100vh - 75px);
    background: #f4fbf6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    margin: -20px; /* Offset default container padding if any */
}

.premium-booking-card {
    background: white;
    width: 100%;
    max-width: 500px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(6, 78, 59, 0.08);
    overflow: hidden;
}

.booking-header {
    background: linear-gradient(rgba(6, 78, 59, 0.7), rgba(6, 78, 59, 0.9)), url('https://images.unsplash.com/photo-1506521781263-d8422e82f27a?q=80&w=2070&auto=format&fit=crop') center/cover;
    padding: 45px 30px;
    color: white;
    text-align: center;
    position: relative;
}

.booking-header h2 {
    font-size: 36px;
    font-weight: 800;
    margin: 10px 0 5px 0;
    letter-spacing: -0.5px;
}

.booking-header p {
    font-size: 15px;
    opacity: 0.85;
    font-weight: 400;
}

.booking-body {
    padding: 40px 35px;
}

.booking-body label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 10px;
}

.booking-body input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    margin-bottom: 25px;
    font-size: 15px;
    transition: all 0.3s ease;
    box-sizing: border-box;
    font-family: inherit;
    color: #111827;
}

.booking-body input:focus {
    outline: none;
    border-color: #22c55e;
    background: white;
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
}

.time-row {
    display: flex;
    gap: 20px;
}

.time-row .form-group {
    flex: 1;
}

.btn-premium {
    width: 100%;
    padding: 16px;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.btn-premium:hover {
    background: #16a34a;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2);
}

/* Customizing date and time inputs - Removed webkit specific hacks in favor of flatpickr */
.flatpickr-input[readonly] {
    background: #f9fafb !important;
}
</style>

<!-- Flatpickr CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">

<div class="booking-page-container">
    <div class="premium-booking-card reveal">
        
        <div class="booking-header">
            <i data-lucide="map-pin" style="width: 36px; height: 36px; opacity: 0.9; color: #22c55e;"></i>
            <h2>Slot {{ slot.slot_number }}</h2>
            <p>Reserve your premium parking space</p>
        </div>

        <div class="booking-body">
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label><i data-lucide="car-front" style="width: 16px; height: 16px; color: #22c55e;"></i> Vehicle Number</label>
                    {{ form.vehicle_number }}
                </div>

                <div class="form-group">
                    <label><i data-lucide="calendar" style="width: 16px; height: 16px; color: #22c55e;"></i> Booking Date</label>
                    {{ form.booking_date }}
                </div>

                <div class="time-row">
                    <div class="form-group">
                        <label><i data-lucide="clock" style="width: 16px; height: 16px; color: #22c55e;"></i> Start Time</label>
                        {{ form.start_time }}
                    </div>

                    <div class="form-group">
                        <label><i data-lucide="clock" style="width: 16px; height: 16px; color: #22c55e;"></i> End Time</label>
                        {{ form.end_time }}
                    </div>
                </div>

                <button type="submit" class="btn-premium">
                    Calculate & Proceed <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
                </button>
            </form>
        </div>

    </div>
</div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    if(window.lucide) {
        lucide.createIcons();
    }

    // Initialize Premium Date Picker
    flatpickr("input[type='date']", {
        altInput: true,
        altFormat: "F j, Y",
        dateFormat: "Y-m-d",
        minDate: "today",
        disableMobile: "true" // forces custom UI on mobile as well
    });

    // Initialize Premium Time Picker
    flatpickr("input[type='time']", {
        enableTime: true,
        noCalendar: true,
        dateFormat: "H:i",
        time_24hr: false, // 12-hour AM/PM format looks more user friendly
        disableMobile: "true"
    });
</script>

{% endblock %}
